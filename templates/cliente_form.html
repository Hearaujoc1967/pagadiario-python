{% extends "base.html" %}

{% block title %}{{ titulo }} - Pagadiario{% endblock %}

{% block body %}

{% include '_sidebar.html' %}<div class="main-content">
    <div class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <h4 class="mb-0 ms-2 flex-grow-1"><i class="fas fa-user-plus"></i> {{ titulo }}</h4>
    </div>

    <div class="p-4">
        <div class="card-panel">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">DNI *</label>
                        <input type="text" class="form-control" name="dni" value="{{ cliente.dni if cliente else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" name="nombre" value="{{ cliente.nombre if cliente else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre del Negocio</label>
                        <input type="text" class="form-control" name="nombre_negocio" value="{{ cliente.nombre_negocio if cliente else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" name="telf" value="{{ cliente.telf if cliente else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ cliente.email if cliente else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control" name="direccion" value="{{ cliente.direccion if cliente else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Dirección de Cobro</label>
                        <input type="text" class="form-control" name="direccion_cobro" value="{{ cliente.direccion_cobro if cliente else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Referencia 1</label>
                        <input type="text" class="form-control" name="referencia_1" value="{{ cliente.referencia_1 if cliente else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Referencia 2</label>
                        <input type="text" class="form-control" name="referencia_2" value="{{ cliente.referencia_2 if cliente else '' }}">
                    </div>
                </div>
                
                <div class="d-flex justify-content-between mt-3">
                    <a href="{{ url_for('clientes') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
