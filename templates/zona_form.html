{% extends "base.html" %}

{% block title %}{{ titulo }} - Pagadiario{% endblock %}

{% block body %}

{% include '_sidebar.html' %}<div class="main-content">
    <div class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <h4 class="mb-0 ms-2 flex-grow-1"><i class="fas fa-map-marker-alt"></i> {{ titulo }}</h4>
    </div>

    <div class="p-4">
        <div class="card-panel">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre de la Zona *</label>
                        <input type="text" class="form-control" name="zona" 
                               value="{{ zona.zona if zona else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control" name="direccion" 
                               value="{{ zona.direccion if zona else '' }}">
                    </div>
                </div>
                
                <div class="d-flex justify-content-between mt-3">
                    <a href="{{ url_for('zonas') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
