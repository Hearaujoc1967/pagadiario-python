{% extends "base.html" %}

{% block title %}{{ titulo }} - Pagadiario{% endblock %}

{% block body %}

{% include '_sidebar.html' %}<div class="main-content">
    <div class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <h4 class="mb-0 ms-2 flex-grow-1"><i class="fas fa-coins"></i> {{ titulo }}</h4>
    </div>

    <div class="p-4">
        <div class="card-panel">
            <h5><i class="fas fa-info-circle"></i> Capital Actual</h5>
            <p><strong>Capital Total:</strong> <span class="text-success">{{ "%.2f"|format(capital.capital or 0) }}</span></p>
        </div>

        <div class="card-panel">
            <h5><i class="fas fa-plus-circle"></i> Datos del Aporte</h5>
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Socio *</label>
                        <select class="form-control" name="id_socio" required>
                            <option value="">-- Seleccionar --</option>
                            {% for s in socios %}
                                <option value="{{ s.id }}" 
                                    {% if aporte and aporte.id_socio == s.id %}selected{% endif %}>
                                    {{ s.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Monto *</label>
                        <input type="number" step="0.01" class="form-control" name="monto" 
                               value="{{ aporte.capital if aporte else '' }}" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" name="descripcion" 
                               value="{{ aporte.descripcion if aporte else '' }}"
                               placeholder="Ej: Aporte inicial, Refuerzo de capital, etc.">
                    </div>
                </div>
                
                <div class="d-flex justify-content-between mt-3">
                    <a href="{{ url_for('capital') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Aporte
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
