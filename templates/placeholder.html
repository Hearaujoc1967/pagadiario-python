{% extends "base.html" %}

{% block title %}{{ titulo }} - Pagadiario{% endblock %}

{% block body %}

{% include '_sidebar.html' %}<div class="main-content">
    <div class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <h4 class="mb-0 ms-2 flex-grow-1"><i class="fas {{ icono }}"></i> {{ titulo }}</h4>
    </div>
    <div class="p-4">
        <div class="card-panel text-center">
            <i class="fas {{ icono }}" style="font-size: 4rem; color: #3498db;"></i>
            <h3 class="mt-3">Módulo de {{ titulo }}</h3>
            <p class="text-muted">Este módulo está en construcción. Pronto estará disponible.</p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-2">
                <i class="fas fa-arrow-left"></i> Volver al Dashboard
            </a>
        </div>
    </div>
</div>

{% endblock %}
